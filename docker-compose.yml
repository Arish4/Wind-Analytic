services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DJANGO_SECRET_KEY: change-me-locally
      DJANGO_ALLOWED_HOSTS: "*"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
